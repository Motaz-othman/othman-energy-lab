<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact · Othman Energy Lab</title>
<meta name="description" content="Contact Othman Energy Lab about your project. We help engineers and clients choose the right system: less energy, lower cost, a cleaner planet.">
<link rel="icon" href="../shared/img/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../shared/img/apple-touch-icon.png">
<meta name="theme-color" content="#0e7c57">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Othman Energy Lab">
<meta property="og:title" content="Contact · Othman Energy Lab">
<meta property="og:description" content="Contact Othman Energy Lab about your project. We help engineers and clients choose the right system: less energy, lower cost, a cleaner planet.">
<meta property="og:url" content="https://www.oenergylab.com/contact/">
<meta property="og:image" content="https://www.oenergylab.com/shared/img/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<link rel="canonical" href="https://www.oenergylab.com/contact/">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="../shared/css/base.css">
<style>
.intro{padding:40px 0 8px;max-width:72ch}
.intro h1{font-size:clamp(28px,3.6vw,40px);line-height:1.1;letter-spacing:-.02em;margin:6px 0 14px}
.intro .lead{font-size:17px;line-height:1.55;color:var(--text2);margin:0}
.formc{max-width:640px;margin-top:28px;padding:28px;border-left:4px solid var(--brand)}
.formc label{font-size:13.5px;font-weight:600;color:var(--text);margin:0 0 6px}
.formc .field{margin-bottom:18px}
.formc input,.formc textarea{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font:inherit;font-size:15px}
.formc textarea{min-height:170px;resize:vertical;line-height:1.5}
.formc input:focus-visible,.formc textarea:focus-visible{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 22%,transparent)}
.formc button.btn{font-size:15px;padding:11px 20px;cursor:pointer}
.status{margin-top:14px;font-size:14px;color:var(--text2)}
.status.ok{color:var(--brand-ink);font-weight:600}
.status.err{color:var(--bad)}
.status a{color:var(--brand-ink);font-weight:600}
</style>
</head>
<body>
<header class="sitebar" data-root="../" data-page="contact"></header>

<main class="wrap">
  <div class="intro">
    <nav class="crumbs" aria-label="Breadcrumb"><a href="../index.html">Home</a> / Contact</nav>
    <h1>Contact us</h1>
    <p class="lead">Tell us about your project, and we’ll help you choose the right system.</p>
  </div>

  <form class="card formc" id="contactForm" novalidate>
    <div class="field">
      <label for="from">Your email</label>
      <input type="email" id="from" name="email" autocomplete="email" required placeholder="name@company.com">
    </div>
    <div class="field">
      <label for="msg">Message</label>
      <textarea id="msg" name="message" required placeholder="How can we help?"></textarea>
    </div>
    <button type="submit" class="btn primary" id="send">Send message →</button>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </form>
</main>

<footer class="sitefoot" data-root="../"></footer>
<script src="../shared/js/site.js"></script>
<script>
// Contact form: posts the sender's email and message to SITE.formEndpoint (FormSubmit); if that fails,
// offers an email link so the message is never lost. With no endpoint set, opens the visitor's email app.
(function(){
  const f=document.getElementById('contactForm'), from=document.getElementById('from'), msg=document.getElementById('msg'),
        btn=document.getElementById('send'), st=document.getElementById('status');
  const say=(t,c='')=>{ st.textContent=t; st.className='status '+c; };
  const mailto=(subject,text,email)=>`mailto:${SITE.email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(text+'\n\nReply to: '+email)}`;
  f.addEventListener('submit',async e=>{
    e.preventDefault();
    const email=from.value.trim(), text=msg.value.trim();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ say('Please enter a valid email address.','err'); from.focus(); return; }
    if(!text){ say('Please write a message.','err'); msg.focus(); return; }
    const subject='Website message from '+email;
    if(!SITE.formEndpoint){ location.href=mailto(subject,text,email); say('Your email app has opened with your message. Press Send there to deliver it.','ok'); return; }
    btn.disabled=true; say('Sending…');
    const ac=new AbortController(), t=setTimeout(()=>ac.abort(),12000);   // don't wait forever if the form service is down
    try{
      const r=await fetch(SITE.formEndpoint,{method:'POST',signal:ac.signal,headers:{'Content-Type':'application/json','Accept':'application/json'},
        body:JSON.stringify({email,message:text,_subject:subject,_replyto:email,_template:'table',_captcha:'false'})});
      const d=await r.json().catch(()=>({}));
      if(!r.ok||String(d.success)==='false') throw new Error(d.message||r.status);
      f.reset(); say('Thank you. Your message has been sent, and we’ll reply to '+email+'.','ok');
    }catch(err){
      st.className='status err';
      st.innerHTML='Sorry, the message could not be sent. <a href="'+mailto(subject,text,email).replace(/"/g,'&quot;')+'">Send it by email instead</a>.';
    }
    clearTimeout(t); btn.disabled=false;
  });
})();
</script>
</body>
</html>
